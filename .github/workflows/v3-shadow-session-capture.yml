name: V3 Shadow Session Capture

on:
  workflow_dispatch:
  schedule:
    # 08:42 KST Monday-Friday. Starts early to absorb GitHub scheduler delay.
    - cron: "42 23 * * 0-4"

permissions:
  contents: read

concurrency:
  group: v3-shadow-session-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve V3 shadow 08:15 handoff
        shell: bash
        run: |
          set -euo pipefail
          FILE="v3-0815-shadow-watchlist.json"
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          test -f "$FILE"

          SCHEMA=$(jq -r '.schemaVersion // ""' "$FILE")
          MODE=$(jq -r '.mode // ""' "$FILE")
          PROD=$(jq -r '.productionWriteAllowed' "$FILE")
          TRADE_DATE=$(jq -r '.tradeDate // ""' "$FILE")
          STATUS=$(jq -r '.status // ""' "$FILE")
          COUNT=$(jq -r '(.codes // []) | length' "$FILE")
          CODES=$(jq -r '(.codes // []) | map(tostring) | join(",")' "$FILE")

          test "$SCHEMA" = "V3_0815_SHADOW_WATCHLIST_V1"
          test "$MODE" = "SHADOW_ONLY"
          test "$PROD" = "false"
          test "$TRADE_DATE" = "$TODAY"

          case "$STATUS" in
            READY|VALID_EMPTY|MARKET_CLOSED) ;;
            *) echo "invalid shadow handoff status=$STATUS"; exit 1 ;;
          esac

          if [ "$COUNT" -eq 0 ]; then
            test "$STATUS" = "VALID_EMPTY" -o "$STATUS" = "MARKET_CLOSED"
            for END in 35 40; do
              jq -n \
                --arg status "$STATUS" \
                --arg td "$TRADE_DATE" \
                --argjson end "$END" \
                '{status:$status,schemaVersion:"V3_SHADOW_LIVE_CAPTURE_V1",mode:"SHADOW_ONLY",productionWriteAllowed:false,tradeDate:$td,codes:[],source:"V3_0815_SHADOW_HANDOFF",endMinute:$end,history:{count:0,from:null,to:null,rows:[]},marketScans:{},scanDiagnostics:{},diagnostics:{startMinute:0,requestedEndMinute:$end,resumeFrom:null,attemptsByMinute:{},recentErrors:[],failReason:null}}' \
                > "/tmp/v3-shadow-live-09${END}.json"
            done
            echo "EMPTY=1" >> "$GITHUB_ENV"
          else
            test "$STATUS" = "READY"
            while IFS= read -r code; do
              [[ "$code" =~ ^[0-9]{6}$ ]] || { echo "invalid code=$code"; exit 1; }
            done < <(jq -r '.codes[] | tostring' "$FILE")
            echo "EMPTY=0" >> "$GITHUB_ENV"
          fi

          echo "TRADE_DATE=$TRADE_DATE" >> "$GITHUB_ENV"
          echo "CODES=$CODES" >> "$GITHUB_ENV"

      - name: Capture 09:00-09:35 candidate path and one full-market scan
        if: env.EMPTY != '1'
        shell: bash
        run: |
          set +e
          python scripts/v3_shadow_live_capture.py \
            --trade-date "$TRADE_DATE" \
            --codes "$CODES" \
            --start-minute 0 \
            --end-minute 35 \
            --scan-minutes "35" \
            --output /tmp/v3-shadow-live-0935.json
          RC=$?
          echo "CAPTURE_0935_RC=$RC" >> "$GITHUB_ENV"
          exit 0

      - name: Upload 09:35 shadow evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v3-shadow-live-${{ env.TRADE_DATE }}-0935-${{ github.run_id }}
          path: /tmp/v3-shadow-live-0935.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 9

      - name: Gate 09:40 continuation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EMPTY" = "1" ]; then
            echo "CONTINUE_0940=0" >> "$GITHUB_ENV"
            exit 0
          fi
          STATUS=$(jq -r '.status // "FAIL"' /tmp/v3-shadow-live-0935.json)
          COUNT=$(jq -r '.history.count // 0' /tmp/v3-shadow-live-0935.json)
          if { [ "$STATUS" = "PASS" ] || [ "$STATUS" = "PARTIAL" ]; } && [ "$COUNT" = "36" ]; then
            echo "CONTINUE_0940=1" >> "$GITHUB_ENV"
          else
            echo "CONTINUE_0940=0" >> "$GITHUB_ENV"
          fi

      - name: Resume 09:36-09:40 candidate-only path
        if: env.EMPTY != '1' && env.CONTINUE_0940 == '1'
        shell: bash
        run: |
          set +e
          python scripts/v3_shadow_live_capture.py \
            --trade-date "$TRADE_DATE" \
            --codes "$CODES" \
            --start-minute 36 \
            --end-minute 40 \
            --scan-minutes "" \
            --resume-from /tmp/v3-shadow-live-0935.json \
            --output /tmp/v3-shadow-live-0940.json
          RC=$?
          echo "CAPTURE_0940_RC=$RC" >> "$GITHUB_ENV"
          exit 0

      - name: Upload 09:40 shadow evidence
        if: always() && (env.EMPTY == '1' || env.CONTINUE_0940 == '1')
        uses: actions/upload-artifact@v7
        with:
          name: v3-shadow-live-${{ env.TRADE_DATE }}-0940-${{ github.run_id }}
          path: /tmp/v3-shadow-live-0940.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 9

      - name: Validate V3 shadow evidence and production isolation
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          for FILE in /tmp/v3-shadow-live-0935.json /tmp/v3-shadow-live-0940.json; do
            test -f "$FILE"
            test "$(jq -r '.schemaVersion' "$FILE")" = "V3_SHADOW_LIVE_CAPTURE_V1"
            test "$(jq -r '.mode' "$FILE")" = "SHADOW_ONLY"
            test "$(jq -r '.productionWriteAllowed' "$FILE")" = "false"
            test "$(jq -r '.tradeDate' "$FILE")" = "$TRADE_DATE"
          done

          if [ "$EMPTY" = "1" ]; then
            for FILE in /tmp/v3-shadow-live-0935.json /tmp/v3-shadow-live-0940.json; do
              STATUS=$(jq -r '.status' "$FILE")
              test "$STATUS" = "VALID_EMPTY" -o "$STATUS" = "MARKET_CLOSED"
              test "$(jq -r '.history.count' "$FILE")" = "0"
            done
          else
            test "$(jq -r '.status' /tmp/v3-shadow-live-0935.json)" = "PASS"
            test "$(jq -r '.history.count' /tmp/v3-shadow-live-0935.json)" = "36"
            test "$(jq -r '.history.from' /tmp/v3-shadow-live-0935.json)" = "$TRADE_DATE 0900"
            test "$(jq -r '.history.to' /tmp/v3-shadow-live-0935.json)" = "$TRADE_DATE 0935"
            test "$(jq -r '.scanDiagnostics["0935"].status // "FAIL"' /tmp/v3-shadow-live-0935.json)" = "PASS"

            test "$(jq -r '.status' /tmp/v3-shadow-live-0940.json)" = "PASS"
            test "$(jq -r '.history.count' /tmp/v3-shadow-live-0940.json)" = "41"
            test "$(jq -r '.history.from' /tmp/v3-shadow-live-0940.json)" = "$TRADE_DATE 0900"
            test "$(jq -r '.history.to' /tmp/v3-shadow-live-0940.json)" = "$TRADE_DATE 0940"
            test "$(jq -r '(.marketScans | keys) == ["0935"]' /tmp/v3-shadow-live-0940.json)" = "true"
          fi

          # This workflow has contents:read and uses only public GET endpoints.
          # Local guard remains as an extra assertion that production bridge files were untouched.
          git diff --exit-code -- watchlist.json live.json live-health.json
