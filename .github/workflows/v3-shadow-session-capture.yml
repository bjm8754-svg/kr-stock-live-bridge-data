name: V3 Shadow Session Capture

on:
  workflow_dispatch:
  schedule:
    # 08:42 KST Monday-Friday. Starts early to absorb GitHub scheduler delay.
    - cron: "42 23 * * 0-4"

permissions:
  contents: read

concurrency:
  group: v3-shadow-session-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve and freeze V3 shadow 08:15 bundle
        shell: bash
        run: |
          set -euo pipefail
          FILE="/tmp/v3-0815-shadow-bundle-resolved.json"
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)

          # Operational authority is the atomic bundle, not separate plan/watchlist files.
          # The 07:35 GitHub fallback guarantees a current-day bundle even when the
          # 08:15 assistant cannot write. The assistant may upgrade the bundle before
          # this workflow resolves it.
          while true; do
            git fetch --quiet origin main || true
            HAVE_CURRENT=0
            if git show origin/main:v3-0815-shadow-bundle.json > "${FILE}.tmp" 2>/dev/null; then
              TRADE_DATE=$(jq -r '.tradeDate // ""' "${FILE}.tmp")
              if [ "$TRADE_DATE" = "$TODAY" ]; then
                HAVE_CURRENT=1
                ORIGIN=$(jq -r '.planOrigin // ""' "${FILE}.tmp")
                DEGRADED=$(jq -r '.degradedMode' "${FILE}.tmp")
                STATUS=$(jq -r '.status // ""' "${FILE}.tmp")
                NOW=$(TZ=Asia/Seoul date +%H%M%S)

                # Prefer only a fully valid assistant upgrade. MARKET_CLOSED is final.
                if [ "$ORIGIN" = "ASSISTANT_DEEP_REVIEW" ] && [ "$DEGRADED" = "false" ]; then
                  mv "${FILE}.tmp" "$FILE"
                  break
                fi
                if [ "$STATUS" = "MARKET_CLOSED" ]; then
                  mv "${FILE}.tmp" "$FILE"
                  break
                fi

                # If the assistant upgrade is absent, keep the valid continuity fallback
                # alive until 08:55, then freeze it so the 09:00 evidence window survives.
                if [ "$ORIGIN" = "MACHINE_CONTINUITY_FALLBACK" ] && [ "$DEGRADED" = "true" ]; then
                  if [[ "$NOW" > "085500" || "$NOW" == "085500" ]]; then
                    mv "${FILE}.tmp" "$FILE"
                    break
                  fi
                  rm -f "${FILE}.tmp"
                  echo "current fallback bundle exists; waiting for assistant upgrade until 08:55 KST"
                else
                  rm -f "${FILE}.tmp"
                  echo "invalid current bundle origin/degraded combination: origin=$ORIGIN degraded=$DEGRADED"
                fi
              else
                rm -f "${FILE}.tmp"
                echo "waiting for current V3 bundle: observed tradeDate=$TRADE_DATE expected=$TODAY"
              fi
            else
              rm -f "${FILE}.tmp"
              echo "waiting for current V3 shadow bundle on origin/main"
            fi

            NOW=$(TZ=Asia/Seoul date +%H%M%S)
            if [[ "$NOW" > "085730" || "$NOW" == "085730" ]]; then
              if [ "$HAVE_CURRENT" = "1" ]; then
                echo "current bundle existed but could not be frozen"
              else
                echo "STALE_0815_BUNDLE: current-date atomic bundle not available by 08:57:30 KST"
              fi
              exit 1
            fi
            sleep 15
          done

          BUNDLE_SHA=$(git rev-parse "origin/main:v3-0815-shadow-bundle.json")
          SCHEMA=$(jq -r '.schemaVersion // ""' "$FILE")
          MODE=$(jq -r '.mode // ""' "$FILE")
          PROD=$(jq -r '.productionWriteAllowed' "$FILE")
          TRADE_DATE=$(jq -r '.tradeDate // ""' "$FILE")
          STATUS=$(jq -r '.status // ""' "$FILE")
          PLAN_ORIGIN=$(jq -r '.planOrigin // ""' "$FILE")
          DEGRADED=$(jq -r '.degradedMode' "$FILE")
          COUNT=$(jq -r '(.watchlist.codes // []) | length' "$FILE")
          CODES=$(jq -r '(.watchlist.codes // []) | map(tostring) | join(",")' "$FILE")

          test "$SCHEMA" = "V3_0815_SHADOW_BUNDLE_V1"
          test "$MODE" = "SHADOW_ONLY"
          test "$PROD" = "false"
          test "$TRADE_DATE" = "$TODAY"
          test "$(jq -r '.watchlist.status // ""' "$FILE")" = "$STATUS"
          test "$(jq -c '(.livePlans // []) | map(.code|tostring)' "$FILE")" = "$(jq -c '(.watchlist.codes // []) | map(tostring)' "$FILE")"

          case "$PLAN_ORIGIN" in
            ASSISTANT_DEEP_REVIEW)
              test "$DEGRADED" = "false"
              test "$(jq -r '.assistantDeepReviewCompleted' "$FILE")" = "true"
              ;;
            MACHINE_CONTINUITY_FALLBACK)
              test "$DEGRADED" = "true"
              test "$(jq -r '.assistantDeepReviewCompleted' "$FILE")" = "false"
              ;;
            *) echo "invalid planOrigin=$PLAN_ORIGIN"; exit 1 ;;
          esac

          case "$STATUS" in
            READY|VALID_EMPTY|MARKET_CLOSED) ;;
            *) echo "invalid shadow bundle status=$STATUS"; exit 1 ;;
          esac

          if [ "$COUNT" -eq 0 ]; then
            test "$STATUS" = "VALID_EMPTY" -o "$STATUS" = "MARKET_CLOSED"
            for END in 35 40; do
              jq -n                 --arg status "$STATUS"                 --arg td "$TRADE_DATE"                 --argjson end "$END"                 --arg sha "$BUNDLE_SHA"                 --slurpfile b "$FILE"                 '{status:$status,schemaVersion:"V3_SHADOW_LIVE_CAPTURE_V1",mode:"SHADOW_ONLY",productionWriteAllowed:false,tradeDate:$td,codes:[],source:"V3_0815_SHADOW_BUNDLE",endMinute:$end,history:{count:0,from:null,to:null,rows:[]},marketScans:{},scanDiagnostics:{},diagnostics:{startMinute:0,requestedEndMinute:$end,resumeFrom:null,attemptsByMinute:{},recentErrors:[],failReason:null},sourcePlan:{bundleSha:$sha,planOrigin:$b[0].planOrigin,degradedMode:$b[0].degradedMode,assistantDeepReviewCompleted:$b[0].assistantDeepReviewCompleted,sourcePlanGeneratedAt:($b[0].sourcePlanGeneratedAt // $b[0].generatedAtKst),sourceTradeDate:$b[0].sourceTradeDate,watchlist:$b[0].watchlist,livePlans:$b[0].livePlans}}'                 > "/tmp/v3-shadow-live-09${END}.json"
            done
            echo "EMPTY=1" >> "$GITHUB_ENV"
          else
            test "$STATUS" = "READY"
            while IFS= read -r code; do
              [[ "$code" =~ ^[0-9]{6}$ ]] || { echo "invalid code=$code"; exit 1; }
            done < <(jq -r '.watchlist.codes[] | tostring' "$FILE")
            echo "EMPTY=0" >> "$GITHUB_ENV"
          fi

          echo "TRADE_DATE=$TRADE_DATE" >> "$GITHUB_ENV"
          echo "CODES=$CODES" >> "$GITHUB_ENV"
          echo "BUNDLE_SHA=$BUNDLE_SHA" >> "$GITHUB_ENV"
          echo "PLAN_ORIGIN=$PLAN_ORIGIN" >> "$GITHUB_ENV"
          echo "DEGRADED_MODE=$DEGRADED" >> "$GITHUB_ENV"

      - name: Capture 09:00-09:35 candidate path and one full-market scan
        if: env.EMPTY != '1'
        shell: bash
        run: |
          set +e
          python scripts/v3_shadow_live_capture.py             --trade-date "$TRADE_DATE"             --codes "$CODES"             --start-minute 0             --end-minute 35             --scan-minutes "35"             --output /tmp/v3-shadow-live-0935.json
          RC=$?
          echo "CAPTURE_0935_RC=$RC" >> "$GITHUB_ENV"
          exit 0

      - name: Freeze 08:15 source into 09:35 evidence
        if: env.EMPTY != '1'
        shell: bash
        run: |
          set -euo pipefail
          jq             --arg sha "$BUNDLE_SHA"             --slurpfile b /tmp/v3-0815-shadow-bundle-resolved.json             '. + {sourcePlan:{bundleSha:$sha,planOrigin:$b[0].planOrigin,degradedMode:$b[0].degradedMode,assistantDeepReviewCompleted:$b[0].assistantDeepReviewCompleted,sourcePlanGeneratedAt:($b[0].sourcePlanGeneratedAt // $b[0].generatedAtKst),sourceTradeDate:$b[0].sourceTradeDate,watchlist:$b[0].watchlist,livePlans:$b[0].livePlans}}'             /tmp/v3-shadow-live-0935.json > /tmp/v3-shadow-live-0935.annotated.json
          mv /tmp/v3-shadow-live-0935.annotated.json /tmp/v3-shadow-live-0935.json

      - name: Upload 09:35 shadow evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v3-shadow-live-${{ env.TRADE_DATE }}-0935-${{ github.run_id }}
          path: |
            /tmp/v3-shadow-live-0935.json
            /tmp/v3-0815-shadow-bundle-resolved.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 9

      - name: Gate 09:40 continuation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EMPTY" = "1" ]; then
            echo "CONTINUE_0940=0" >> "$GITHUB_ENV"
            exit 0
          fi
          STATUS=$(jq -r '.status // "FAIL"' /tmp/v3-shadow-live-0935.json)
          COUNT=$(jq -r '.history.count // 0' /tmp/v3-shadow-live-0935.json)
          if { [ "$STATUS" = "PASS" ] || [ "$STATUS" = "PARTIAL" ]; } && [ "$COUNT" = "36" ]; then
            echo "CONTINUE_0940=1" >> "$GITHUB_ENV"
          else
            echo "CONTINUE_0940=0" >> "$GITHUB_ENV"
          fi

      - name: Resume 09:36-09:40 candidate-only path
        if: env.EMPTY != '1' && env.CONTINUE_0940 == '1'
        shell: bash
        run: |
          set +e
          python scripts/v3_shadow_live_capture.py             --trade-date "$TRADE_DATE"             --codes "$CODES"             --start-minute 36             --end-minute 40             --scan-minutes ""             --resume-from /tmp/v3-shadow-live-0935.json             --output /tmp/v3-shadow-live-0940.json
          RC=$?
          echo "CAPTURE_0940_RC=$RC" >> "$GITHUB_ENV"
          exit 0

      - name: Freeze 08:15 source into 09:40 evidence
        if: env.EMPTY != '1' && env.CONTINUE_0940 == '1'
        shell: bash
        run: |
          set -euo pipefail
          jq             --arg sha "$BUNDLE_SHA"             --slurpfile b /tmp/v3-0815-shadow-bundle-resolved.json             '. + {sourcePlan:{bundleSha:$sha,planOrigin:$b[0].planOrigin,degradedMode:$b[0].degradedMode,assistantDeepReviewCompleted:$b[0].assistantDeepReviewCompleted,sourcePlanGeneratedAt:($b[0].sourcePlanGeneratedAt // $b[0].generatedAtKst),sourceTradeDate:$b[0].sourceTradeDate,watchlist:$b[0].watchlist,livePlans:$b[0].livePlans}}'             /tmp/v3-shadow-live-0940.json > /tmp/v3-shadow-live-0940.annotated.json
          mv /tmp/v3-shadow-live-0940.annotated.json /tmp/v3-shadow-live-0940.json

      - name: Upload 09:40 shadow evidence
        if: always() && (env.EMPTY == '1' || env.CONTINUE_0940 == '1')
        uses: actions/upload-artifact@v7
        with:
          name: v3-shadow-live-${{ env.TRADE_DATE }}-0940-${{ github.run_id }}
          path: |
            /tmp/v3-shadow-live-0940.json
            /tmp/v3-0815-shadow-bundle-resolved.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 9

      - name: Validate V3 shadow evidence and production isolation
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          for FILE in /tmp/v3-shadow-live-0935.json /tmp/v3-shadow-live-0940.json; do
            test -f "$FILE"
            test "$(jq -r '.schemaVersion' "$FILE")" = "V3_SHADOW_LIVE_CAPTURE_V1"
            test "$(jq -r '.mode' "$FILE")" = "SHADOW_ONLY"
            test "$(jq -r '.productionWriteAllowed' "$FILE")" = "false"
            test "$(jq -r '.tradeDate' "$FILE")" = "$TRADE_DATE"
            test "$(jq -r '.sourcePlan.bundleSha // ""' "$FILE")" = "$BUNDLE_SHA"
            test "$(jq -r '.sourcePlan.planOrigin // ""' "$FILE")" = "$PLAN_ORIGIN"
            test "$(jq -r '.sourcePlan.degradedMode' "$FILE")" = "$DEGRADED_MODE"
            test "$(jq -c '.sourcePlan.watchlist.codes // []' "$FILE")" = "$(jq -c '.codes // []' "$FILE")"
            test "$(jq -c '(.sourcePlan.livePlans // []) | map(.code|tostring)' "$FILE")" = "$(jq -c '.codes // []' "$FILE")"
          done

          if [ "$EMPTY" = "1" ]; then
            for FILE in /tmp/v3-shadow-live-0935.json /tmp/v3-shadow-live-0940.json; do
              STATUS=$(jq -r '.status' "$FILE")
              test "$STATUS" = "VALID_EMPTY" -o "$STATUS" = "MARKET_CLOSED"
              test "$(jq -r '.history.count' "$FILE")" = "0"
            done
          else
            test "$(jq -r '.status' /tmp/v3-shadow-live-0935.json)" = "PASS"
            test "$(jq -r '.history.count' /tmp/v3-shadow-live-0935.json)" = "36"
            test "$(jq -r '.history.from' /tmp/v3-shadow-live-0935.json)" = "$TRADE_DATE 0900"
            test "$(jq -r '.history.to' /tmp/v3-shadow-live-0935.json)" = "$TRADE_DATE 0935"
            test "$(jq -r '.scanDiagnostics["0935"].status // "FAIL"' /tmp/v3-shadow-live-0935.json)" = "PASS"

            test "$(jq -r '.status' /tmp/v3-shadow-live-0940.json)" = "PASS"
            test "$(jq -r '.history.count' /tmp/v3-shadow-live-0940.json)" = "41"
            test "$(jq -r '.history.from' /tmp/v3-shadow-live-0940.json)" = "$TRADE_DATE 0900"
            test "$(jq -r '.history.to' /tmp/v3-shadow-live-0940.json)" = "$TRADE_DATE 0940"
            test "$(jq -r '(.marketScans | keys) == ["0935"]' /tmp/v3-shadow-live-0940.json)" = "true"
          fi

          git diff --exit-code -- watchlist.json live.json live-health.json
