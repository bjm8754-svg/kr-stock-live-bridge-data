name: Crypto Blind Decision Cards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/crypto_blind_decision_cards.py"
      - ".github/workflows/crypto-blind-decision-cards.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/crypto_blind_decision_cards.py
      - name: Guard no future leakage
        run: |
          python - <<'PY'
          import glob,json
          for p in glob.glob('research/crypto_blind/cards/C*.json'):
              d=json.load(open(p,encoding='utf-8')); assert d['futureIncluded'] is False
              c=d['cutoff']
              for a in d['assets'].values():
                  for k in ('daily15','weekly8','monthly6'):
                      assert all(x[0] <= c for x in a[k])
          print('CRYPTO_BLIND_DECISION_CARDS_NO_FUTURE_LEAK: PASS')
          PY
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/crypto_blind/cards
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "update crypto blind decision cards"
          git pull --rebase origin main
          git push
