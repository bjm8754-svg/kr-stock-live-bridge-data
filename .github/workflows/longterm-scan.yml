name: Long-term MA600 Swing Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/longterm_scan.py"
      - "longterm-scan-config.json"
      - ".github/workflows/longterm-scan.yml"
  schedule:
    # 16:30 KST, Monday-Friday. Holiday/stale runs are detected and not committed.
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: longterm-ma600-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "finance-datareader==0.9.202" "pandas==3.0.6"

      - name: Run V2 scanner self-tests
        run: |
          python scripts/test_longterm_scan_v2.py

      - name: Run full KOSPI/KOSDAQ scan
        run: |
          python scripts/longterm_scan.py \
            --config longterm-scan-config.json \
            --output longterm-scan.json \
            --brief-output longterm-scan-brief.json

      - name: Validate scan output
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(jq -r '.status // "MISSING"' longterm-scan.json)
          UNIVERSE=$(jq -r '.coverage.universe // 0' longterm-scan.json)
          CURRENT=$(jq -r '.coverage.currentTradeDate // 0' longterm-scan.json)
          TRADE_DATE=$(jq -r '.tradeDate // ""' longterm-scan.json)
          METHOD=$(jq -r '.methodologyVersion // ""' longterm-scan.json)
          ALLC=$(jq -r '.counts.allCandidates // -1' longterm-scan.json)
          QUALIFIED=$(jq -r '.counts.qualifiedPool // -1' longterm-scan.json)
          BRIEFING=$(jq -r '.counts.briefingCandidates // -1' longterm-scan.json)
          CAND_RATIO=$(jq -r '.coverage.candidateRatio // 1' longterm-scan.json)
          MAX_CAND_RATIO=$(jq -r '.maxCandidateRatioForPass // 0.25' longterm-scan-config.json)

          KST_TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          KST_HHMM=$(TZ=Asia/Seoul date +%H%M)
          echo "status=$STATUS method=$METHOD tradeDate=$TRADE_DATE kstToday=$KST_TODAY kstHHMM=$KST_HHMM universe=$UNIVERSE current=$CURRENT allCandidates=$ALLC qualifiedPool=$QUALIFIED briefingCandidates=$BRIEFING candidateRatio=$CAND_RATIO maxCandidateRatio=$MAX_CAND_RATIO"

          if [ "$STATUS" != "PASS" ]; then
            echo "canonical scanner requires PASS; status=$STATUS"
            exit 1
          fi

          case "$METHOD" in
            YBM_SWING_V2_*) ;;
            *) echo "unexpected methodologyVersion=$METHOD"; exit 1 ;;
          esac

          if ! jq -e '.allCandidates | type=="array"' longterm-scan.json >/dev/null; then
            echo "allCandidates schema missing"
            exit 1
          fi

          if ! jq -e '.qualifiedPool | type=="array"' longterm-scan.json >/dev/null; then
            echo "qualifiedPool schema missing"
            exit 1
          fi

          if ! jq -e '.briefingCandidates | type=="array"' longterm-scan.json >/dev/null; then
            echo "briefingCandidates schema missing"
            exit 1
          fi

          if ! jq -e '.schemaVersion=="YBM_BRIEF_V1" and (.qualifiedPool|type=="array") and (.briefingCandidates|type=="array")' longterm-scan-brief.json >/dev/null; then
            echo "compact brief schema missing"
            exit 1
          fi

          MIN_UNIVERSE=$(jq -r '.minUniverseCount // 2200' longterm-scan-config.json)
          CURRENT_COVERAGE=$(awk -v c="$CURRENT" -v u="$UNIVERSE" 'BEGIN { if (u<=0) print 0; else printf "%.6f", c/u }')
          if [ "$UNIVERSE" -lt "$MIN_UNIVERSE" ]; then
            echo "universe coverage gate failed: universe=$UNIVERSE min=$MIN_UNIVERSE"
            exit 1
          fi
          if ! awk -v r="$CURRENT_COVERAGE" 'BEGIN { exit !(r >= 0.90) }'; then
            echo "current-date coverage gate failed: ratio=$CURRENT_COVERAGE"
            exit 1
          fi

          if ! awk -v a="$CAND_RATIO" -v b="$MAX_CAND_RATIO" 'BEGIN { exit !(a <= b) }'; then
            echo "candidate selectivity gate failed: ratio=$CAND_RATIO max=$MAX_CAND_RATIO"
            exit 1
          fi


          # Push-triggered validation may run during market hours. It may test the scanner,
          # but it must never overwrite the canonical after-close output before 15:40 KST.
          if [ "$KST_HHMM" -lt 1540 ]; then
            echo "pre-close validation passed; do not commit canonical scan"
            echo "SKIP_COMMIT=1" >> "$GITHUB_ENV"
            git checkout -- longterm-scan.json
            exit 0
          fi

          if [ "$TRADE_DATE" != "$KST_TODAY" ]; then
            echo "no fresh Korean session data yet (holiday or data not ready); skip commit"
            echo "SKIP_COMMIT=1" >> "$GITHUB_ENV"
            git checkout -- longterm-scan.json
            exit 0
          fi

      - name: Commit scan result
        if: env.SKIP_COMMIT != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add longterm-scan.json longterm-scan-brief.json
          if git diff --cached --quiet; then
            echo "no scan changes"
            exit 0
          fi
          git commit -m "update long-term MA600 swing scan"
          git pull --rebase origin main
          git push
