name: Long-term MA600 Swing Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/longterm_scan.py"
      - "longterm-scan-config.json"
      - ".github/workflows/longterm-scan.yml"
  schedule:
    # 16:30 KST, Monday-Friday. Holiday/stale runs are detected and not committed.
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: longterm-ma600-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade finance-datareader pandas

      - name: Run full KOSPI/KOSDAQ scan
        run: |
          python scripts/longterm_scan.py \
            --config longterm-scan-config.json \
            --output longterm-scan.json

      - name: Validate scan output
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(jq -r '.status // "MISSING"' longterm-scan.json)
          UNIVERSE=$(jq -r '.coverage.universe // 0' longterm-scan.json)
          CURRENT=$(jq -r '.coverage.currentTradeDate // 0' longterm-scan.json)
          TRADE_DATE=$(jq -r '.tradeDate // ""' longterm-scan.json)

          KST_TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          KST_HHMM=$(TZ=Asia/Seoul date +%H%M)
          echo "status=$STATUS tradeDate=$TRADE_DATE kstToday=$KST_TODAY kstHHMM=$KST_HHMM universe=$UNIVERSE current=$CURRENT"

          if [ "$STATUS" != "PASS" ] && [ "$STATUS" != "PARTIAL" ]; then
            echo "scanner did not produce a usable result"
            exit 1
          fi

          if [ "$UNIVERSE" -lt 1500 ] || [ "$CURRENT" -lt 1000 ]; then
            echo "coverage gate failed"
            exit 1
          fi

          # Push-triggered validation may run during market hours. It may test the scanner,
          # but it must never overwrite the canonical after-close output before 15:40 KST.
          if [ "$KST_HHMM" -lt 1540 ]; then
            echo "pre-close validation passed; do not commit canonical scan"
            echo "SKIP_COMMIT=1" >> "$GITHUB_ENV"
            git checkout -- longterm-scan.json
            exit 0
          fi

          if [ "$TRADE_DATE" != "$KST_TODAY" ]; then
            echo "no fresh Korean session data yet (holiday or data not ready); skip commit"
            echo "SKIP_COMMIT=1" >> "$GITHUB_ENV"
            git checkout -- longterm-scan.json
            exit 0
          fi

      - name: Commit scan result
        if: env.SKIP_COMMIT != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add longterm-scan.json
          if git diff --cached --quiet; then
            echo "no scan changes"
            exit 0
          fi
          git commit -m "update long-term MA600 swing scan"
          git push
