name: One-time Canonical Scan Migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-canonical-scan.yml"

permissions:
  contents: write
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install scanner dependencies
        run: python -m pip install -r requirements-scanner.txt
      - name: Download validated full-scan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/migration
          gh run download 36122568757             --repo "${{ github.repository }}"             --name longterm-scan-full-36122568757             --dir /tmp/migration
          test -s /tmp/migration/longterm-scan-full.json
      - name: Build compact canonical from validated artifact
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path
          import longterm_scan as scan
          src=Path("/tmp/migration/longterm-scan-full.json")
          out=json.loads(src.read_text(encoding="utf-8"))
          assert out.get("status")=="PASS", out.get("status")
          assert out.get("tradeDate")=="20260923", out.get("tradeDate")
          brief=scan.build_brief_output(out)
          assert brief.get("schemaVersion")=="YBM_BRIEF_V2"
          assert brief.get("tradeDate")=="20260923"
          assert len(brief.get("chartCandidates") or [])>0
          Path("longterm-scan.json").write_text(
              json.dumps(brief,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          print(json.dumps({
              "schemaVersion":brief["schemaVersion"],
              "tradeDate":brief["tradeDate"],
              "status":brief["status"],
              "chartCandidates":len(brief["chartCandidates"]),
              "qualifiedPool":len(brief["qualifiedPool"]),
              "briefingCandidates":len(brief["briefingCandidates"]),
              "riskWarnings":len(brief["riskWarnings"])
          },ensure_ascii=False))
          PY
      - name: Validate migrated canonical
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion=="YBM_BRIEF_V2" and
            .status=="PASS" and
            .tradeDate=="20260923" and
            (.chartCandidates|length)>0 and
            (.qualifiedPool|type=="array") and
            (.briefingCandidates|type=="array") and
            (.riskWarnings|type=="array") and
            ([.chartCandidates[] | select((.chartGrade.grade // "")=="")] | length)==0
          ' longterm-scan.json >/dev/null
      - name: Commit canonical migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add longterm-scan.json
          if git diff --cached --quiet; then
            echo "NO_MIGRATION_CHANGE"
            exit 0
          fi
          git commit -m "migrate latest completed scan to chart-first canonical"
          git pull --rebase origin main
          git push
