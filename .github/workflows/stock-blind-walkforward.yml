name: Korean Stock Blind Walk-Forward

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/stock_blind_walkforward.py"
      - "scripts/stock_blind_runner.py"
      - "scripts/stock_blind_privacy.py"
      - "scripts/test_stock_blind_privacy.py"
      - "research/stock_blind/ACTIVE_EPISODE.json"
      - "research/stock_blind/episodes/**/decisions/**"
      - ".github/workflows/stock-blind-walkforward.yml"

permissions:
  contents: write

concurrency:
  group: stock-blind-walkforward
  cancel-in-progress: true

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install scanner dependencies
        run: python -m pip install -r requirements-scanner.txt

      - name: Fast blind privacy unit test
        run: python scripts/test_stock_blind_privacy.py

      - name: Blind-only methodology label
        if: ${{ false }}
        run: echo disabled-during-unit-gate

      - name: Build blind stock card and portfolio state
        if: ${{ false }}
        run: echo disabled-during-unit-gate

      - name: Guard blind card
        if: ${{ false }}
        run: echo disabled-during-unit-gate

      - name: Commit blind state
        if: ${{ false }}
        run: echo disabled-during-unit-gate
