name: Probe Naver Scan Endpoints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-naver-scan.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public ranking endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error
          urls = [
            "https://m.stock.naver.com/front-api/stock/domestic/stockList?sortType=up&category=KOSPI&page=1&pageSize=20",
            "https://m.stock.naver.com/front-api/stock/domestic/stockList?sortType=quantTop&category=KOSPI&page=1&pageSize=20",
            "https://m.stock.naver.com/api/stocks/up/KOSPI?page=1&pageSize=20",
            "https://m.stock.naver.com/api/stocks/quantTop/KOSPI?page=1&pageSize=20",
            "https://m.stock.naver.com/api/stocks/marketValue/KOSPI?page=1&pageSize=20",
          ]
          headers = {
            "User-Agent": "Mozilla/5.0",
            "Accept": "application/json,text/plain,*/*",
            "Referer": "https://m.stock.naver.com/",
          }
          ok = 0
          for url in urls:
            req=urllib.request.Request(url, headers=headers)
            try:
              with urllib.request.urlopen(req, timeout=15) as r:
                body=r.read().decode("utf-8","replace")
                print("PROBE", r.status, url)
                print(body[:500].replace("\n"," "))
                if r.status == 200:
                  ok += 1
            except urllib.error.HTTPError as e:
              body=e.read().decode("utf-8","replace")
              print("PROBE", e.code, url)
              print(body[:300].replace("\n"," "))
            except Exception as e:
              print("PROBE_ERR", url, repr(e))
          print("PROBE_OK_COUNT", ok)
          PY
