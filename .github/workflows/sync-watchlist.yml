name: Sync Cloudflare Watchlist

on:
  push:
    branches: [main]
    paths:
      - "watchlist.json"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync watchlist to Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          CODES=$(jq -r '.codes | join(",")' watchlist.json)
          if [ -z "$CODES" ]; then
            echo "watchlist codes empty"
            exit 1
          fi

          URL="https://kr-stock-live-bridge.bjm8754.workers.dev/watchlist?codes=${CODES}"
          RESPONSE=$(curl --fail --silent --show-error "$URL")
          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
          RETURNED=$(echo "$RESPONSE" | jq -c '.codes // []')
          REQUESTED=$(jq -c '.codes' watchlist.json)

          if [ "$STATUS" != "WATCHLIST_SAVED" ]; then
            echo "unexpected status: $STATUS"
            exit 1
          fi

          if [ "$RETURNED" != "$REQUESTED" ]; then
            echo "code mismatch"
            echo "requested=$REQUESTED"
            echo "returned=$RETURNED"
            exit 1
          fi
