name: Sync Cloudflare Watchlist

on:
  push:
    branches: [main]
    paths:
      - "watchlist.json"
      - ".github/workflows/sync-watchlist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cloudflare-watchlist
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate watchlist schema
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.tradeDate | type=="string" and test("^[0-9]{8}$")) and
            (.codes | type=="array" and length>0) and
            ([.codes[] | select((type!="string") or (test("^[0-9]{6}$")|not))] | length==0) and
            ((.codes | unique | length) == (.codes | length))
          ' watchlist.json >/dev/null

      - name: Sync watchlist to Cloudflare Worker
        id: sync
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_WRITE_TOKEN: ${{ secrets.CLOUDFLARE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          CODES=$(jq -r '.codes | join(",")' watchlist.json)
          TRADE_DATE=$(jq -r '.tradeDate' watchlist.json)
          REQUESTED=$(jq -c '.codes' watchlist.json)
          echo "requested=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "trade_date=$TRADE_DATE" >> "$GITHUB_OUTPUT"

          if [ -z "${CLOUDFLARE_WRITE_TOKEN:-}" ]; then
            echo "reason=MISSING_CLOUDFLARE_WRITE_TOKEN" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          URL="https://kr-stock-live-bridge.bjm8754.workers.dev/watchlist?codes=${CODES}&tradeDate=${TRADE_DATE}"
          set +e
          RESPONSE=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_WRITE_TOKEN}" \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            "$URL")
          CURL_STATUS=$?
          set -e

          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "reason=CLOUDFLARE_HTTP_OR_NETWORK_FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
          RETURNED=$(echo "$RESPONSE" | jq -c '.codes // []')
          RETURNED_DATE=$(echo "$RESPONSE" | jq -r '.tradeDate // empty')

          if [ "$STATUS" != "WATCHLIST_SAVED" ]; then
            echo "reason=UNEXPECTED_WORKER_STATUS" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$RETURNED" != "$REQUESTED" ]; then
            echo "reason=WATCHLIST_CODE_MISMATCH" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$RETURNED_DATE" != "$TRADE_DATE" ]; then
            echo "reason=WATCHLIST_TRADE_DATE_MISMATCH" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "worker_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "reason=NONE" >> "$GITHUB_OUTPUT"

      - name: Write sync status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TRADE_DATE=$(jq -r '.tradeDate' watchlist.json)
          REQUESTED=$(jq -c '.codes' watchlist.json)
          OUTCOME="${{ steps.sync.outcome }}"
          REASON="${{ steps.sync.outputs.reason }}"
          WORKER_STATUS="${{ steps.sync.outputs.worker_status }}"

          if [ -z "$REASON" ]; then REASON="SYNC_STEP_FAILED"; fi

          if [ "$OUTCOME" = "success" ]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi

          cat > watchlist-sync-status.json <<EOF
          {
            "status": "$STATUS",
            "tradeDate": "$TRADE_DATE",
            "syncedAtUtc": "$NOW_UTC",
            "codes": $REQUESTED,
            "mode": "POST_BEARER",
            "cloudflareStatus": "$WORKER_STATUS",
            "reason": "$REASON"
          }
          EOF
          jq . watchlist-sync-status.json

      - name: Commit sync status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist-sync-status.json
          if git diff --cached --quiet; then
            echo "no status changes"
          else
            git commit -m "record watchlist sync status"
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$i" -eq 3 ]; then
                exit 1
              fi
              sleep 2
            done
          fi

      - name: Enforce fail-closed sync
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.sync.outcome }}" = "success"

# secure-sync-trigger-v3
