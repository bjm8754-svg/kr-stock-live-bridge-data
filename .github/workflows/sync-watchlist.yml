name: Sync Cloudflare Watchlist

on:
  push:
    branches: [main]
    paths:
      - "watchlist.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cloudflare-watchlist
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate watchlist schema
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.tradeDate | type=="string" and test("^[0-9]{8}$")) and
            (.codes | type=="array" and length>0) and
            ([.codes[] | select((type!="string") or (test("^[0-9]{6}$")|not))] | length==0) and
            ((.codes | unique | length) == (.codes | length))
          ' watchlist.json >/dev/null

      - name: Sync watchlist to Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          CODES=$(jq -r '.codes | join(",")' watchlist.json)

          URL="https://kr-stock-live-bridge.bjm8754.workers.dev/watchlist?codes=${CODES}"
          RESPONSE=$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            "$URL")
          echo "$RESPONSE"

          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
          RETURNED=$(echo "$RESPONSE" | jq -c '.codes // []')
          REQUESTED=$(jq -c '.codes' watchlist.json)

          if [ "$STATUS" != "WATCHLIST_SAVED" ]; then
            echo "unexpected status: $STATUS"
            exit 1
          fi

          if [ "$RETURNED" != "$REQUESTED" ]; then
            echo "code mismatch"
            echo "requested=$REQUESTED"
            echo "returned=$RETURNED"
            exit 1
          fi

          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > watchlist-sync-status.json <<EOF
          {
            "status": "PASS",
            "syncedAtUtc": "$NOW_UTC",
            "codes": $REQUESTED,
            "cloudflareStatus": "$STATUS"
          }
          EOF

      - name: Commit sync status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist-sync-status.json
          if git diff --cached --quiet; then
            echo "no status changes"
            exit 0
          fi
          git commit -m "record watchlist sync status"
          git pull --rebase origin main
          git push
