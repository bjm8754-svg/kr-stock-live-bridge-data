name: One-shot Long-term Scan Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-longterm-scan.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-longterm-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Repair trend-bridge regression fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test_longterm_scan_v2.py')
          s = p.read_text(encoding='utf-8')
          old = 'assert 109.0 <= tb["bridgeClose"] <= 113.0'
          new = 'assert tb["bridgeClose"] == 116.0'
          if old not in s:
              raise SystemExit('expected stale trend-bridge assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install scanner dependencies
        run: python -m pip install -r requirements-scanner.txt

      - name: Run V2 scanner self-tests
        run: python scripts/test_longterm_scan_v2.py

      - name: Run full KOSPI/KOSDAQ scan
        run: |
          python scripts/longterm_scan.py \
            --config longterm-scan-config.json \
            --output /tmp/longterm-scan-full.json \
            --brief-output longterm-scan.json

      - name: Validate execution-level invariants
        run: python scripts/validate_scan_precision.py /tmp/longterm-scan-full.json

      - name: Validate recovery target
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(jq -r '.expectedCompletedTradeDate // empty' longterm-scan-health.json)
          STATUS=$(jq -r '.status // "MISSING"' /tmp/longterm-scan-full.json)
          TRADE_DATE=$(jq -r '.tradeDate // empty' /tmp/longterm-scan-full.json)
          METHOD=$(jq -r '.methodologyVersion // empty' /tmp/longterm-scan-full.json)
          UNIVERSE=$(jq -r '.coverage.universe // 0' /tmp/longterm-scan-full.json)
          CURRENT=$(jq -r '.coverage.currentTradeDate // 0' /tmp/longterm-scan-full.json)
          ERRORS=$(jq -r '.coverage.fetchErrors // 999999' /tmp/longterm-scan-full.json)
          echo "expected=$EXPECTED status=$STATUS tradeDate=$TRADE_DATE method=$METHOD universe=$UNIVERSE current=$CURRENT fetchErrors=$ERRORS"
          test -n "$EXPECTED"
          test "$STATUS" = "PASS"
          test "$TRADE_DATE" = "$EXPECTED"
          case "$METHOD" in YBM_SWING_V2_*) ;; *) exit 1 ;; esac
          test "$UNIVERSE" -ge 2200
          awk -v c="$CURRENT" -v u="$UNIVERSE" 'BEGIN { exit !(u > 0 && c/u >= 0.99) }'
          test "$ERRORS" -le 5
          jq -e '.schemaVersion=="YBM_BRIEF_V2" and (.chartCandidates|type=="array") and (.qualifiedPool|type=="array") and (.briefingCandidates|type=="array") and (.riskWarnings|type=="array")' longterm-scan.json >/dev/null

      - name: Commit repaired test and recovered canonical scan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_longterm_scan_v2.py longterm-scan.json
          git diff --cached --check
          git commit -m "repair trend-bridge regression and recover prior scan"
          git pull --rebase origin main
          git push
