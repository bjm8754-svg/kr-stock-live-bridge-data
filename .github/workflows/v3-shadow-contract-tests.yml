name: V3 Shadow Contract Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/validate_v3_0815_shadow_plan.py"
      - "scripts/test_v3_0815_shadow_plan.py"
      - "scripts/v3_shadow_live_capture.py"
      - "scripts/test_v3_shadow_live_capture.py"
      - "V3_0815_SHADOW_INTEGRATION.md"
      - ".github/workflows/v3-shadow-live-capture.yml"
      - ".github/workflows/v3-shadow-session-capture.yml"
      - ".github/workflows/v3-shadow-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test V3 08:15 shadow plan contract
        run: python scripts/test_v3_0815_shadow_plan.py
      - name: Test production-isolated live capture guards
        run: python scripts/test_v3_shadow_live_capture.py
