name: Test Hardened Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/worker_v3_hardened.mjs"
      - "cloudflare/test_worker_v3.mjs"
      - ".github/workflows/test-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: node --check cloudflare/worker_v3_hardened.mjs

      - name: Regression tests
        run: node cloudflare/test_worker_v3.mjs
