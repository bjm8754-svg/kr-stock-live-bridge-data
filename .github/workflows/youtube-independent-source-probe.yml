name: Independent YouTube Source Probe (NO vidIQ)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/youtube_ingest/independent_probe.py"
      - ".github/workflows/youtube-independent-source-probe.yml"

permissions:
  contents: read

jobs:
  probe-public-research-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open-source transcript clients only
        run: python -m pip install --disable-pip-version-check --quiet youtube-transcript-api yt-dlp
      - name: Test PUBLIC source access (no third-party app or YouTube account)
        run: python research/youtube_ingest/independent_probe.py
