name: Validate Live Freshness

on:
  push:
    branches: [main]
    paths:
      - "live.json"
      - "watchlist.json"
      - "scripts/validate_live_freshness.py"
      - ".github/workflows/validate-live.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-live-freshness
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect future-staged watchlist
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          WATCH_DATE=$(jq -r '.tradeDate // empty' watchlist.json)
          if [[ "$WATCH_DATE" =~ ^[0-9]{8}$ ]] && [ "$WATCH_DATE" > "$TODAY" ]; then
            echo "skip_future=true" >> "$GITHUB_OUTPUT"
            echo "FUTURE_WATCHLIST_STAGED_SKIP today=$TODAY watchDate=$WATCH_DATE"
          else
            echo "skip_future=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate semantic freshness
        if: steps.gate.outputs.skip_future != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_live_freshness.py
          cat live-health.json

      - name: Commit live health
        if: steps.gate.outputs.skip_future != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-health.json
          if git diff --cached --quiet; then
            echo "no live-health changes"
          else
            git commit -m "update live freshness health"
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$i" -eq 3 ]; then
                exit 1
              fi
              sleep 2
            done
          fi

      - name: Enforce fail-closed status
        if: steps.gate.outputs.skip_future != 'true'
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(jq -r '.status' live-health.json)
          if [ "$STATUS" != "PASS" ]; then
            echo "live freshness validation failed"
            jq . live-health.json
            exit 1
          fi

      - name: Confirm future staging skip
        if: steps.gate.outputs.skip_future == 'true'
        run: echo "FUTURE_WATCHLIST_STAGING_PASS"
