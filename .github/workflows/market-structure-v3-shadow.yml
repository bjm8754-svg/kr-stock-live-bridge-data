name: Market Structure V3 Shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/msv3/**"
      - "scripts/market_structure_v3.py"
      - "scripts/test_market_structure_v3.py"
      - "scripts/test_market_structure_v3_freshness.py"
      - "scripts/validate_market_structure_v3.py"
      - "scripts/validate_market_structure_v3_review_packet.py"
      - "scripts/validate_market_structure_v3_freshness.py"
      - "scripts/build_market_structure_v3_review_shards.py"
      - "market-structure-v3-config.json"
      - ".github/workflows/market-structure-v3-shadow.yml"
  schedule:
    # Shadow EOD run. V2 remains the production baseline until explicit cutover.
    - cron: "45 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-structure-v3-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-scanner.txt

      - name: Run generic V3 regression suite
        run: python scripts/test_market_structure_v3.py

      - name: Run V3 freshness semantic tests
        run: python scripts/test_market_structure_v3_freshness.py

      - name: Run full-market V3 shadow scan
        run: |
          python scripts/market_structure_v3.py \
            --config market-structure-v3-config.json \
            --output market-structure-v3.json \
            --full-output /tmp/market-structure-v3-full.json \
            --review-output /tmp/market-structure-v3-review.json

      - name: Validate V3 canonical invariants
        run: python scripts/validate_market_structure_v3.py market-structure-v3.json

      - name: Validate V3 review packet
        run: |
          python scripts/validate_market_structure_v3_review_packet.py \
            /tmp/market-structure-v3-review.json \
            --config market-structure-v3-config.json

      - name: Validate coverage and freshness
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(jq -r '.status' market-structure-v3.json)
          SCHEMA=$(jq -r '.schemaVersion' market-structure-v3.json)
          TRADE_DATE=$(jq -r '.tradeDate // ""' market-structure-v3.json)
          PROCESSED=$(jq -r '.coverage.universeProcessed // 0' market-structure-v3.json)
          CUR=$(jq -r '.coverage.currentTradeDate // 0' market-structure-v3.json)
          CAND_RATIO=$(jq -r '.coverage.candidateRatio // 1' market-structure-v3.json)
          REVIEW_COUNT=$(jq -r '.count // 0' /tmp/market-structure-v3-review.json)
          MIN_UNIVERSE=$(jq -r '.minUniverseCount // 2200' market-structure-v3-config.json)
          MAX_CAND=$(jq -r '.maxCandidateRatioForPass // 0.30' market-structure-v3-config.json)
          MAX_REVIEW=$(jq -r '.maxDeepReviewCandidates // 36' market-structure-v3-config.json)
          KST_HHMM=$(TZ=Asia/Seoul date +%H%M)

          echo "status=$STATUS schema=$SCHEMA tradeDate=$TRADE_DATE processed=$PROCESSED current=$CUR candidateRatio=$CAND_RATIO reviewCount=$REVIEW_COUNT"

          [ "$SCHEMA" = "MARKET_STRUCTURE_V3" ]
          [ "$PROCESSED" -ge "$MIN_UNIVERSE" ]
          [ "$REVIEW_COUNT" -le "$MAX_REVIEW" ]
          awk -v a="$CAND_RATIO" -v b="$MAX_CAND" 'BEGIN { exit !(a <= b) }'

          if [ "$KST_HHMM" -lt 1540 ]; then
            echo "pre-close shadow validation passed; exercise handoff/shards but skip canonical V3 commit"
            echo "SKIP_COMMIT=1" >> "$GITHUB_ENV"
            exit 0
          fi

          python scripts/validate_market_structure_v3_freshness.py \
            --scan market-structure-v3.json \
            --output /tmp/market-structure-v3-health.json \
            --strict

          [ "$STATUS" = "PASS" ]

      - name: Build size-bounded V3 review shards
        shell: bash
        run: |
          set -euo pipefail
          rm -f market-structure-v3-review-shard-*.json
          python scripts/build_market_structure_v3_review_shards.py \
            --review /tmp/market-structure-v3-review.json \
            --index-output market-structure-v3-review-index.json \
            --output-dir . \
            --prefix market-structure-v3-review-shard \
            --max-shard-bytes 300000

          test "$(jq -r '.schemaVersion' market-structure-v3-review-index.json)" = "MARKET_STRUCTURE_V3_REVIEW_INDEX_V1"
          test "$(jq -r '.mode' market-structure-v3-review-index.json)" = "SHADOW_ONLY"
          test "$(jq -r '.productionWriteAllowed' market-structure-v3-review-index.json)" = "false"
          test "$(jq -r '.status' market-structure-v3-review-index.json)" = "PASS"
          test "$(jq -r '.totalCount' market-structure-v3-review-index.json)" = "$(jq -r '.count' /tmp/market-structure-v3-review.json)"
          test "$(jq -r '[.shards[].count] | add // 0' market-structure-v3-review-index.json)" = "$(jq -r '.totalCount' market-structure-v3-review-index.json)"
          test "$(jq -r '[.shards[].byteSize] | max // 0' market-structure-v3-review-index.json)" -le 300000

      - name: Build compact V3 08:15 handoff
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(jq -r '.status' market-structure-v3.json)
          TRADE_DATE=$(jq -r '.tradeDate // ""' market-structure-v3.json)
          GENERATED=$(jq -r '.generatedAtKst // ""' market-structure-v3.json)
          METHODOLOGY=$(jq -r '.methodologyVersion // ""' market-structure-v3.json)
          PROCESSED=$(jq -r '.coverage.universeProcessed // 0' market-structure-v3.json)
          CUR=$(jq -r '.coverage.currentTradeDate // 0' market-structure-v3.json)
          CAND_RATIO=$(jq -r '.coverage.candidateRatio // 1' market-structure-v3.json)
          REVIEW_COUNT=$(jq -r '.totalCount // 0' market-structure-v3-review-index.json)
          REVIEW_TRADE_DATE=$(jq -r '.tradeDate // ""' market-structure-v3-review-index.json)
          REVIEW_GENERATED=$(jq -r '.generatedAtKst // ""' market-structure-v3-review-index.json)
          REVIEW_METHODOLOGY=$(jq -r '.methodologyVersion // ""' market-structure-v3-review-index.json)
          REVIEW_INDEX_SCHEMA=$(jq -r '.schemaVersion // ""' market-structure-v3-review-index.json)
          REVIEW_SOURCE_SCHEMA=$(jq -r '.sourceSchemaVersion // ""' market-structure-v3-review-index.json)
          SHARD_COUNT=$(jq -r '.shardCount // 0' market-structure-v3-review-index.json)

          [ "$STATUS" = "PASS" ]
          [ -n "$TRADE_DATE" ]
          [ -n "$GENERATED" ]
          [ -n "$METHODOLOGY" ]
          [ "$REVIEW_COUNT" -le 36 ]
          [ "$REVIEW_TRADE_DATE" = "$TRADE_DATE" ]
          [ "$REVIEW_GENERATED" = "$GENERATED" ]
          [ "$REVIEW_METHODOLOGY" = "$METHODOLOGY" ]
          [ "$REVIEW_INDEX_SCHEMA" = "MARKET_STRUCTURE_V3_REVIEW_INDEX_V1" ]
          [ "$REVIEW_SOURCE_SCHEMA" = "MARKET_STRUCTURE_V3" ]
          if [ "$REVIEW_COUNT" -eq 0 ]; then
            [ "$SHARD_COUNT" -eq 0 ]
          else
            [ "$SHARD_COUNT" -ge 1 ]
          fi

          jq -n \
            --arg status "$STATUS" \
            --arg tradeDate "$TRADE_DATE" \
            --arg generatedAtKst "$GENERATED" \
            --arg methodologyVersion "$METHODOLOGY" \
            --arg reviewIndexSchemaVersion "$REVIEW_INDEX_SCHEMA" \
            --arg artifactName "market-structure-v3-artifacts-${{ github.run_id }}" \
            --argjson workflowRunId "${{ github.run_id }}" \
            --argjson universeProcessed "$PROCESSED" \
            --argjson currentTradeDate "$CUR" \
            --argjson candidateRatio "$CAND_RATIO" \
            --argjson reviewCount "$REVIEW_COUNT" \
            --argjson reviewShardCount "$SHARD_COUNT" \
            '{
              schemaVersion:"MARKET_STRUCTURE_V3_HANDOFF_V1",
              mode:"SHADOW_ONLY",
              productionWriteAllowed:false,
              status:$status,
              tradeDate:$tradeDate,
              generatedAtKst:$generatedAtKst,
              methodologyVersion:$methodologyVersion,
              freshnessStatus:"PASS",
              canonicalValidated:true,
              reviewPacketValidated:true,
              reviewShardsValidated:true,
              coverage:{
                universeProcessed:$universeProcessed,
                currentTradeDate:$currentTradeDate,
                candidateRatio:$candidateRatio,
                reviewCount:$reviewCount,
                reviewShardCount:$reviewShardCount
              },
              source:{
                workflowRunId:$workflowRunId,
                artifactName:$artifactName,
                canonicalPath:"market-structure-v3.json",
                reviewArtifactPath:"/tmp/market-structure-v3-review.json",
                reviewIndexPath:"market-structure-v3-review-index.json",
                reviewIndexSchemaVersion:$reviewIndexSchemaVersion
              }
            }' > market-structure-v3-handoff.json

          test "$(jq -r '.schemaVersion' market-structure-v3-handoff.json)" = "MARKET_STRUCTURE_V3_HANDOFF_V1"
          test "$(jq -r '.mode' market-structure-v3-handoff.json)" = "SHADOW_ONLY"
          test "$(jq -r '.productionWriteAllowed' market-structure-v3-handoff.json)" = "false"
          test "$(jq -r '.status' market-structure-v3-handoff.json)" = "PASS"
          test "$(jq -r '.tradeDate' market-structure-v3-handoff.json)" = "$TRADE_DATE"
          test "$(jq -r '.generatedAtKst' market-structure-v3-handoff.json)" = "$REVIEW_GENERATED"
          test "$(jq -r '.methodologyVersion' market-structure-v3-handoff.json)" = "$REVIEW_METHODOLOGY"
          test "$(jq -r '.coverage.reviewCount' market-structure-v3-handoff.json)" = "$REVIEW_COUNT"
          test "$(jq -r '.coverage.reviewShardCount' market-structure-v3-handoff.json)" = "$SHARD_COUNT"

      - name: Upload V3 diagnostics and monolithic review artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-structure-v3-artifacts-${{ github.run_id }}
          path: |
            /tmp/market-structure-v3-full.json
            /tmp/market-structure-v3-review.json
            /tmp/market-structure-v3-health.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

      - name: Commit lightweight V3 shadow result and shard handoff
        if: env.SKIP_COMMIT != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f market-structure-v3-review.json

          git add market-structure-v3.json market-structure-v3-handoff.json market-structure-v3-review-index.json
          git add -A -- 'market-structure-v3-review-shard-*.json'
          if git diff --cached --quiet; then
            echo "no V3 shadow changes"
            exit 0
          fi
          git commit -m "update market structure v3 shadow shard handoff"
          git pull --rebase origin main
          git push
